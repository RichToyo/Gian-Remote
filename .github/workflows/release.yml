name: Release Remote
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable stable tag, e.g. v1.0.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: remote-production
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'RichToyo/Gian-Remote' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve immutable source tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          SHA=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$SHA" origin/main
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo 'Release exists; retry local download/upload without rebuilding or replacing assets'; exit 1; fi
          git checkout --detach "$SHA"
          node scripts/verify-source.mjs
          test "v$(node -p "require('./release.json').version")" = "$RELEASE_TAG"
          node -e 'if(JSON.parse(require("fs").readFileSync(".gian-source.json")).workingTree)throw Error("Uncommitted export")'
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Scan publication source for public English
        run: node scripts/check-public-english.mjs --ref "${{ steps.source.outputs.sha }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
  images:
    needs: qualify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.qualify.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate once
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: gian-remote:build-${{ needs.qualify.outputs.sha }}-${{ matrix.arch }}
          build-args: |
            GIAN_REMOTE_BUILD_ID=${{ needs.qualify.outputs.sha }}
            GIAN_REMOTE_VERSION=${{ inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test actual candidate and save the identical image offline
        env:
          IMAGE: gian-remote:build-${{ needs.qualify.outputs.sha }}-${{ matrix.arch }}
          RELEASE_SHA: ${{ needs.qualify.outputs.sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_ID")" = "$PLATFORM"
          bash scripts/smoke-image.sh "$IMAGE_ID" "$RELEASE_SHA"
          mkdir artifacts
          # The daemon ID may be a config or manifest digest. The archive
          # parser must cryptographically link both to this exact tested image.
          docker save "$IMAGE_ID" | gzip -n > "artifacts/gian-remote-$RELEASE_TAG-linux-$ARCH.tar.gz"
          node scripts/release-metadata.mjs image artifacts "$ARCH" "$IMAGE_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-image-${{ matrix.arch }}
          path: artifacts/
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: [qualify, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.qualify.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: offline-image-*
          merge-multiple: true
          path: artifacts
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Publish immutable offline images, pinned tooling and receipt
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.qualify.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-public-english.mjs --ref "$RELEASE_SHA"
          node scripts/release-metadata.mjs create remote-release.json
          gh release create "$RELEASE_TAG" remote-release.json SHA256SUMS artifacts/*.tar.gz compose.yaml scripts/deploy.sh scripts/offline-release.py --verify-tag --title "Gian Remote $RELEASE_TAG" --notes "Remote Server and Web. Download and upload the verified offline image from your own machine; publication never deploys a server."
