name: Public English source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  english:
    if: github.repository == 'RichToyo/Gian' || github.repository == 'RichToyo/Gian-Proxies' || github.repository == 'RichToyo/Gian-Remote'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/check-public-english.mjs --ref HEAD
